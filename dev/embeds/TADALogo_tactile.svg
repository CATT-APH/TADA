

<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
<!-- Braille Measurements and Notes
Dot diameter: 1.44mm
Dot distance in same cell: 2.34mm
Distance between cells: 6.2mm
Group translate  on X: 8.54mm
Group translate on Y between lines: 10.88mm
-->

<defs>
<!-- Initial braille cell setup. Reference these for individual dots in your Use element. -->
<g id="brlCell">
<circle id="dot1" cx="0.72mm" cy="0.72mm" r="0.72mm" fill="black"/>
<circle id="dot2" cx="0.72mm" cy="3.06mm" r="0.72mm" fill="black"/>
<circle id="dot3" cx="0.72mm" cy="5.4mm" r="0.72mm" fill="black"/>

<circle id="dot4" cx="3.06mm" cy="0.72mm" r="0.72mm" fill="black"/>
<circle id="dot5" cx="3.06mm" cy="3.06mm" r="0.72mm" fill="black"/>
<circle id="dot6" cx="3.06mm" cy="5.4mm" r="0.72mm" fill="black"/>
</g>

<!-- Grade 1 Alphabet -->

<g id="brl_d">
<use href="#dot1"/>
<use href="#dot4"/>
<use href="#dot5"/>
</g>

<g id="brl_t">
<use href="#dot2"/>
<use href="#dot4"/>
<use href="#dot5"/>
