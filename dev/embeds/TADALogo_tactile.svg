	C 57, 24 41, 6 5, 6
	C 29, 6 19, 26 0, 42 Z"
	fill="hsl(0, 0%, 75%)"/>
</g>


</g>
<g id="mapTrail">
<path id="trail" d="M 103, 320
	C 123, 300  217, 285 224, 285
	S 279, 395 301, 405
	S 380, 365 395, 355
	S 480, 335  475, 450" class="trail"/>

<g id="xMark" transform="rotate(40, 475, 450) translate(5, 10)">
