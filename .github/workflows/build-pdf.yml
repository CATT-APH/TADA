name: Build PDFs from Markdown

"on":
  push:
    branches: [main]
    paths:
      - '**/*.md'

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pandoc and PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex librsvg2-bin imagemagick python3 poppler-utils

      - name: Flatten transparent PNGs (xelatex can't handle alpha channel)
        run: |
          find . -iname "*.png" -not -path "./pdf/*" -not -path "./.git/*" | while read -r img; do
            mogrify -background white -alpha remove -alpha off "$img"
          done

      - name: Replace broken remote images with alt text
        run: |
          python3 << 'PYEOF'
          import re, urllib.request, glob

          pattern = re.compile(r'!\[([^\]]*)\]\((https?://[^\)]+)\)')

          def is_broken(url):
              try:
                  req = urllib.request.Request(url, method='HEAD')
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return resp.status >= 400
              except Exception:
                  return True

          checked = {}
          for path in glob.glob('**/*.md', recursive=True):
              if path.startswith('pdf/'):
                  continue
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()

              def replace(m):
                  alt, url = m.group(1), m.group(2)
                  if url not in checked:
                      checked[url] = is_broken(url)
                  if checked[url]:
                      print(f"Broken image in {path}: {url}")
                      return f"*{alt}*" if alt else "*[image unavailable]*"
                  return m.group(0)

              new_content = pattern.sub(replace, content)
              if new_content != content:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(new_content)
          PYEOF

      - name: Convert Markdown files to PDF
        run: |
          mkdir -p pdf
          find . -name "*.md" -not -path "./pdf/*" | while read -r file; do
            rel="${file#./}"
            out="pdf/${rel%.md}.pdf"
            mkdir -p "$(dirname "$out")"
            pandoc "$file" -o "$out" --pdf-engine=xelatex --resource-path=.
          done

      - name: Bundle each tier's activities into one combined PDF
        run: |
          BASE=adventure_map/adventure_map_activities

          pdfunite \
            "pdf/$BASE/beginner/1_beginner.pdf" \
            "pdf/$BASE/beginner/2_beginner.pdf" \
            "pdf/$BASE/beginner/3_beginner.pdf" \
            "pdf/$BASE/beginner/4_beginner.pdf" \
            pdf/beginner-bundle.pdf

          pdfunite \
            "pdf/$BASE/intermediate/1_intermediate.pdf" \
            "pdf/$BASE/intermediate/2_intermediate.pdf" \
            "pdf/$BASE/intermediate/3_intermediate.pdf" \
            "pdf/$BASE/intermediate/4_intermediate.pdf" \
            pdf/intermediate-bundle.pdf

          pdfunite \
            "pdf/$BASE/advanced/1_advanced.pdf" \
            "pdf/$BASE/advanced/2_advanced.pdf" \
            "pdf/$BASE/advanced/3_advanced.pdf" \
            "pdf/$BASE/advanced/2D3DOverview.pdf" \
            "pdf/$BASE/advanced/2DIntro.pdf" \
            "pdf/$BASE/advanced/4_advanced.pdf" \
            "pdf/$BASE/advanced/5_advanced.pdf" \
            "pdf/$BASE/advanced/6_advanced.pdf" \
            "pdf/$BASE/advanced/7_advanced.pdf" \
            "pdf/$BASE/advanced/8_advanced.pdf" \
            "pdf/$BASE/advanced/9_advanced.pdf" \
            pdf/advanced-bundle.pdf

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdf/
          git diff --cached --quiet || git commit -m "Auto-generate PDFs from Markdown"
          git push
