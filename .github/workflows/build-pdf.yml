name: Build PDFs from Markdown

"on":
  push:
    branches: [main]
    paths:
      - '**/*.md'

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pandoc and PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex librsvg2-bin imagemagick python3 poppler-utils

      - name: Flatten transparent PNGs (xelatex can't handle alpha channel)
        run: |
          find . -iname "*.png" -not -path "./pdf/*" -not -path "./.git/*" | while read -r img; do
            mogrify -background white -alpha remove -alpha off "$img"
          done

      - name: Replace broken remote images with alt text
        run: |
          python3 << 'PYEOF'
          import re, urllib.request, glob

          pattern = re.compile(r'!\[([^\]]*)\]\((https?://[^\)]+)\)')

          def is_broken(url):
              try:
                  req = urllib.request.Request(url, method='HEAD')
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return resp.status >= 400
              except Exception:
                  return True

          checked = {}
          for path in glob.glob('**/*.md', recursive=True):
              if path.startswith('pdf/'):
                  continue
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()

              def replace(m):
                  alt, url = m.group(1), m.group(2)
                  if url not in checked:
                      checked[url] = is_broken(url)
                  if checked[url]:
                      print(f"Broken image in {path}: {url}")
                      return f"*{alt}*" if alt else "*[image unavailable]*"
                  return m.group(0)

              new_content = pattern.sub(replace, content)
              if new_content != content:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(new_content)
          PYEOF

      - name: Convert Markdown files to PDF
        run: |
          mkdir -p pdf
          find . -name "*.md" -not -path "./pdf/*" | while read -r file; do
            rel="${file#./}"
            out="pdf/${rel%.md}.pdf"
            mkdir -p "$(dirname "$out")"
            pandoc "$file" -o "$out" --pdf-engine=xelatex --resource-path=.
          done

      - name: Bundle each tier's activities into one combined PDF
        run: |
          # Bundle order comes from each source .md file's `order:` frontmatter
          # field (see scripts/fm.py), not from filenames — this is what lets
          # the advanced tier's non-numeric sequence (1, 2, 3, 2D3DOverview,
          # 2DIntro, 4, 5, ...) bundle correctly. Files without an `order`
          # field are skipped, so nothing is silently included by accident.
          python3 << 'PYEOF'
          import subprocess, sys
          sys.path.insert(0, "scripts")
          import fm

          BASE = "adventure_map/adventure_map_activities"
          TIERS = ["beginner", "intermediate", "advanced"]

          import glob, os
          for tier in TIERS:
              items = []
              for src in sorted(glob.glob(f"{BASE}/{tier}/*.md")):
                  with open(src, encoding="utf-8") as f:
                      text = f.read()
                  order = fm.get_order(text)
                  if order is None:
                      continue
                  pdf_path = f"pdf/{BASE}/{tier}/{os.path.splitext(os.path.basename(src))[0]}.pdf"
                  items.append((order, pdf_path))
              items.sort(key=lambda x: x[0])
              pdfs = [p for _, p in items]
              if not pdfs:
                  print(f"No ordered activities found for {tier}, skipping bundle.")
                  continue
              out = f"pdf/{tier}-bundle.pdf"
              print(f"Bundling {tier}: {pdfs}")
              subprocess.run(["pdfunite", *pdfs, out], check=True)
          PYEOF

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdf/
          git diff --cached --quiet || git commit -m "Auto-generate PDFs from Markdown"
          git push
