name: Update activity navigation and index

# Runs the footer (Previous/Next) and Adventure Map index generators
# whenever an activity file or the map itself changes on main, and
# opens a Pull Request with the result. It NEVER pushes to main
# directly — someone has to review and merge the PR, same as any other
# change. If the scripts find nothing to update, no PR is opened.
#
# You can also trigger it manually from the Actions tab (workflow_dispatch)
# after adding order/nav_title/index_title frontmatter to a new activity,
# instead of waiting for the next push.

"on":
  push:
    branches: [main]
    paths:
      - 'adventure_map/adventure_map_activities/**/*.md'
      - 'adventure_map/04_ADVENTURE_MAP.md'
  workflow_dispatch:
    inputs:
      run_migration:
        description: "One-time only: also add order/nav_title/etc. frontmatter to existing files that don't have it yet"
        type: boolean
        default: false

jobs:
  update-nav:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run one-time migration (only if requested)
        if: ${{ github.event.inputs.run_migration == 'true' }}
        run: python3 scripts/migrate_add_frontmatter.py

      - name: Run footer generator
        run: python3 scripts/update_nav.py

      - name: Run index generator
        run: python3 scripts/update_index.py

      - name: Open PR with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Auto-update activity navigation and index"
          title: "Auto-update: activity navigation and index"
          body: |
            Generated by `scripts/update_nav.py` and `scripts/update_index.py`.

            - Footer (Previous/Next) links rewritten for any activity file with an `order:` field.
            - Beginner/Intermediate index entries in `04_ADVENTURE_MAP.md` regenerated inside the `AUTO-GENERATED` marker blocks.
            - Advanced tier index is never touched by this workflow — it's hand-curated.

            Review the diff before merging, as always.
          branch: auto/update-nav
          delete-branch: true
